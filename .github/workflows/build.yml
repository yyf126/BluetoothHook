name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto increment version
        run: |
          # 读取根目录 build.gradle 中的 versionCode
          VERSION_CODE=$(grep -oP 'versionCode \K\d+' build.gradle)
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          
          # 替换 versionCode
          sed -i "s/versionCode $VERSION_CODE/versionCode $NEW_VERSION_CODE/" build.gradle
          
          # 修改 versionName
          sed -i 's/versionName ".*"/versionName "1.0.'$NEW_VERSION_CODE'"/' build.gradle
          
          echo "Version code incremented: $VERSION_CODE -> $NEW_VERSION_CODE"
          echo "NEW_VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v${{ env.NEW_VERSION_CODE }}
          # 使用通配符匹配实际输出路径（可能是 build/outputs/... 或 app/build/...）
          path: '**/build/outputs/apk/debug/*.apk'
